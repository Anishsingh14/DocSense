# Serves the built site and forwards /api/... to the backend with the /api prefix removed,
# so the browser sees one origin and no CORS setup is needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API accepts uploads up to 25 MB.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An answer can take a few minutes when providers are slow.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React Router: any other path serves the app, so refreshing /chat works.
    location / {
        try_files $uri /index.html;
    }
}
